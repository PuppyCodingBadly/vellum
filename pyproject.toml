[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vellum"
version = "0.1.5"
description = "A calibre-like ebook library manager"
requires-python = ">=3.11"
dependencies = ["requests", "PyGObject", "beautifulsoup4"]

[project.scripts]
vellum = "vellum.app:main"

[tool.setuptools.packages.find]
where = ["src"]
