# Vellum Flatpak manifest.
#
# This packages the prebuilt Flutter Linux release bundle. Stage the sources
# and export a repository with:
#
#   ./tool/build-flatpak.sh
#
# Set REPO_DIR to export into an existing repository (for publishing) and
# FLATPAK_GPG_KEY / FLATPAK_GPG_HOME to sign its summaries.

app-id: io.github.vellum.Vellum
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: vellum

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  # Calibre libraries and folder pickers. Folder choices outside Documents go
  # through the document portal; no whole-home grant, because installed plugin
  # code runs in the sidecar and would inherit it.
  - --filesystem=xdg-documents
  # PDFium is bundled; the Dart loader honors this path first.
  - --env=PDFIUM_PATH=/app/lib/libpdfium.so
  # The OCR fallback runs /app/bin/tesseract; its language data lives here.
  - --env=TESSDATA_PREFIX=/app/share/tessdata

modules:
  # Calibre plugins import third-party libraries that the GNOME runtime does
  # not ship.  These wheels are unpacked into /app/lib/python3.13/site-packages
  # so the sidecar can load real calibre metadata-source and store plugins.
  - name: python3-calibre-plugin-deps
    buildsystem: simple
    build-commands:
      - >-
        pip install --prefix=/app --ignore-installed --no-index --find-links=.
        lxml==6.0.2 six==1.17.0 beautifulsoup4==4.15.0 soupsieve==3.0.3
        typing_extensions==4.16.0 html5lib==1.1 webencodings==0.5.1
        requests==2.33.1 certifi==2026.10.19 idna==3.20 urllib3==2.8.0
        charset_normalizer==3.5.2
    sources:
      - type: file
        path: wheels/lxml-6.0.2-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
      - type: file
        path: wheels/six-1.17.0-py2.py3-none-any.whl
      - type: file
        path: wheels/beautifulsoup4-4.15.0-py3-none-any.whl
      - type: file
        path: wheels/soupsieve-3.0.3-py3-none-any.whl
      - type: file
        path: wheels/typing_extensions-4.16.0-py3-none-any.whl
      - type: file
        path: wheels/html5lib-1.1-py2.py3-none-any.whl
      - type: file
        path: wheels/webencodings-0.5.1-py2.py3-none-any.whl
      - type: file
        path: wheels/requests-2.33.1-py3-none-any.whl
      - type: file
        path: wheels/certifi-2026.10.19-py3-none-any.whl
      - type: file
        path: wheels/idna-3.20-py3-none-any.whl
      - type: file
        path: wheels/urllib3-2.8.0-py3-none-any.whl
      - type: file
        path: wheels/charset_normalizer-3.5.2-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl

  # Scanned PDF pages have no text layer; the reader sends the page raster to
  # Tesseract and reflows its word boxes. Only the English model is bundled;
  # build with more models in tessdata-eng to read other scripts.
  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_SHARED_LIBS:BOOL=ON
      - -DBUILD_TRAINING_TOOLS:BOOL=OFF
      - -DBUILD_TESTS:BOOL=OFF
      - -DENABLE_LTO:BOOL=ON
    post-install:
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/LICENSE /app/share/licenses/io.github.vellum.Vellum/TESSERACT-LICENSE
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
        sha256: 9218e62793116d42a9f6d14cd9348518b27f382096eea3d0f2d1a24616bb5884
    modules:
      - name: leptonica
        buildsystem: cmake-ninja
        builddir: true
        config-opts:
          - -DBUILD_SHARED_LIBS:BOOL=ON
          - -DENABLE_PNG:BOOL=ON
          - -DENABLE_TIFF:BOOL=OFF
          - -DENABLE_WEBP:BOOL=OFF
          - -DENABLE_GIF:BOOL=OFF
          - -DENABLE_OPENJPEG:BOOL=OFF
          - -DENABLE_JPEG:BOOL=OFF
        post-install:
          - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/leptonica-license.txt /app/share/licenses/io.github.vellum.Vellum/LEPTONICA-LICENSE
        sources:
          - type: archive
            url: https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
            sha256: c73363397f96eb1295602bf44d708a994ad42046c791bf03ea0505d829bdb6a7

  - name: tessdata-eng
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata /app/share/tessdata/eng.traineddata
      - install -Dm644 LICENSE /app/share/licenses/io.github.vellum.Vellum/TESSDATA-LICENSE
    sources:
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/LICENSE
        sha256: cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30

  - name: vellum
    buildsystem: simple
    build-commands:
      - mkdir -p /app/vellum /app/bin /app/lib /app/share/applications /app/share/metainfo /app/share/icons /app/share/licenses/io.github.vellum.Vellum
      - cp -a bundle/. /app/vellum/
      - cp -a sidecar /app/vellum/sidecar
      - install -Dm755 vellum.sh /app/bin/vellum
      - install -Dm755 libpdfium.so /app/lib/libpdfium.so
      - install -Dm644 data/io.github.vellum.Vellum.desktop /app/share/applications/io.github.vellum.Vellum.desktop
      - install -Dm644 data/io.github.vellum.Vellum.metainfo.xml /app/share/metainfo/io.github.vellum.Vellum.metainfo.xml
      - cp -a data/icons/hicolor/. /app/share/icons/hicolor/
      - install -Dm644 PDFIUM-LICENSE /app/share/licenses/io.github.vellum.Vellum/PDFIUM-LICENSE
    sources:
      - type: dir
        path: .
