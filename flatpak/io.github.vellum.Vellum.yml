# Vellum Flatpak manifest.
#
# This packages the prebuilt Flutter Linux release bundle. Stage the sources
# and export a repository with:
#
#   ./tool/build-flatpak.sh
#
# Set REPO_DIR to export into an existing repository (for publishing) and
# FLATPAK_GPG_KEY / FLATPAK_GPG_HOME to sign its summaries.

app-id: io.github.vellum.Vellum
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: vellum

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  # Calibre libraries and folder pickers.
  - --filesystem=xdg-documents
  - --filesystem=home:ro
  # PDFium is bundled; the Dart loader honors this path first.
  - --env=PDFIUM_PATH=/app/lib/libpdfium.so

modules:
  - name: vellum
    buildsystem: simple
    build-commands:
      - mkdir -p /app/vellum /app/bin /app/lib /app/share/applications /app/share/metainfo /app/share/icons /app/share/licenses/io.github.vellum.Vellum
      - cp -a bundle/. /app/vellum/
      - cp -a sidecar /app/vellum/sidecar
      - install -Dm755 vellum.sh /app/bin/vellum
      - install -Dm755 libpdfium.so /app/lib/libpdfium.so
      - install -Dm644 data/io.github.vellum.Vellum.desktop /app/share/applications/io.github.vellum.Vellum.desktop
      - install -Dm644 data/io.github.vellum.Vellum.metainfo.xml /app/share/metainfo/io.github.vellum.Vellum.metainfo.xml
      - cp -a data/icons/hicolor/. /app/share/icons/hicolor/
      - install -Dm644 PDFIUM-LICENSE /app/share/licenses/io.github.vellum.Vellum/PDFIUM-LICENSE
    sources:
      - type: dir
        path: .
